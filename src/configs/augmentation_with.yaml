defaults:
  - model: conformer
  - writer: cometml
  - metrics: example
  - datasets: augmentation_test
  - dataloader: example
  - transforms: example_only_instance
  - _self_

optimizer:
  _target_: torch.optim.Adam
  lr: 0.0003
  betas: [0.9, 0.98]
  eps: 1e-9
  weight_decay: 1e-6

lr_scheduler:
  _target_: src.utils.lr_scheduler.warmup_cosine
  warmup_fraction: 0.05
  min_lr: 3e-6

loss_function:
  _target_: src.loss.CTCLossWrapper

text_encoder:
  _target_: src.text_encoder.CTCTextEncoder

dataloader:
  batch_size: 12
  num_workers: 4

writer:
  run_name: "augmentation test: with augmentations"
  save_name: augmentation_with

trainer:
  n_epochs: 5
  epoch_len: null
  log_step: 200
  device_tensors: [spectrogram, text_encoded]
  device: auto
  max_grad_norm: 5.0
  skip_oom: false
  resume_from: null
  override: false
  monitor: "min val_WER_(Argmax)"
  save_period: 1
  early_stop: 0
  save_dir: saved
  seed: 42
